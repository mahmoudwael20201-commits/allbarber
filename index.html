<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>allbarber UAE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
color:white;
min-height:100vh;
background:
radial-gradient(circle at 10% 10%,#ff004455,transparent 25%),
radial-gradient(circle at 90% 20%,#0066ff55,transparent 25%),
radial-gradient(circle at 50% 100%,#8a00ff55,transparent 30%),
linear-gradient(135deg,#030303,#111,#050505);
}

header{
padding:20px 7%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ffffff22;
background:#00000088;
position:sticky;
top:0;
z-index:10;
}

.logo{font-size:30px;font-weight:bold}
.logo span{color:#ffd700}

button{
cursor:pointer;
font-weight:bold;
}

.admin-button{
padding:11px 18px;
border:0;
border-radius:25px;
color:white;
background:linear-gradient(90deg,red,orange,#ffd700,#00c853,#008cff,#8a2be2);
}

.hero{
text-align:center;
padding:65px 20px 30px;
}

.hero h1{
font-size:52px;
margin-bottom:12px;
}

.hero h1 span{color:#ffd700}

.hero p{
color:#ccc;
font-size:18px;
margin-bottom:30px;
}

.search{
max-width:700px;
margin:auto;
display:flex;
background:white;
border-radius:50px;
padding:6px;
}

.search input{
flex:1;
border:0;
outline:0;
padding:15px 20px;
font-size:16px;
border-radius:50px;
}

.search button{
border:0;
padding:15px 25px;
border-radius:50px;
color:white;
background:linear-gradient(90deg,red,orange,#ffd700,#00c853,#008cff,purple);
}

.filters{
max-width:1100px;
margin:25px auto;
padding:0 20px;
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

.filter{
padding:12px 18px;
border-radius:30px;
background:#ffffff12;
border:1px solid #ffffff22;
color:white;
}

.filter.active{
background:#ffd700;
color:#000;
}

.container{
max-width:1150px;
margin:auto;
padding:30px 20px;
}

.results-title{
text-align:center;
margin-bottom:30px;
font-size:30px;
}

.barbers{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.barber{
background:#ffffff0d;
border:1px solid #ffffff1a;
border-radius:25px;
overflow:hidden;
}

.barber-top{
padding:25px;
background:linear-gradient(135deg,#ff0000,#8a2be2,#0066ff);
}

.icon{
font-size:55px;
margin-bottom:10px;
}

.info{padding:20px}

.location{
color:#bbb;
margin-bottom:10px;
}

.rating{
color:#ffd700;
margin-bottom:15px;
}

.price{
color:#00ff88;
font-size:18px;
font-weight:bold;
margin-bottom:15px;
}

.tags{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-bottom:18px;
}

.tag{
background:#ffffff12;
border:1px solid #ffffff22;
padding:7px 10px;
border-radius:20px;
font-size:12px;
}

.book{
width:100%;
padding:14px;
border:0;
border-radius:12px;
color:white;
background:linear-gradient(90deg,red,orange,#ffd700,#00c853,#008cff,#8a2be2);
}

.overlay{
display:none;
position:fixed;
inset:0;
background:#000000dd;
z-index:200;
align-items:center;
justify-content:center;
padding:20px;
}

.card{
width:430px;
max-width:100%;
max-height:90vh;
overflow-y:auto;
background:#151515;
padding:30px;
border-radius:20px;
}

.card h2{
color:#ffd700;
margin-bottom:20px;
}

.input,.select{
width:100%;
padding:13px;
margin-bottom:12px;
border-radius:10px;
border:1px solid #444;
background:#222;
color:white;
}

.primary{
width:100%;
padding:13px;
border:0;
border-radius:10px;
background:#00c853;
color:white;
}

.secondary{
width:100%;
padding:13px;
border:0;
border-radius:10px;
background:#555;
color:white;
margin-top:10px;
}

.error{
color:#ff4444;
margin-top:10px;
}

.success{
color:#00ff88;
margin-top:10px;
}

.admin-panel{
display:none;
position:fixed;
inset:0;
background:#050505;
z-index:100;
overflow-y:auto;
padding:30px;
}

.admin-container{
max-width:1000px;
margin:auto;
}

.admin-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.admin-header h2{color:#ffd700}

.close-admin{
background:#ff3333;
color:white;
border:0;
padding:10px 18px;
border-radius:10px;
}

.admin-box{
background:#151515;
padding:25px;
border-radius:20px;
margin-bottom:25px;
}

.admin-box h3{
color:#ffd700;
margin-bottom:20px;
}

.admin-item{
background:#222;
padding:18px;
border-radius:12px;
margin-bottom:12px;
}

.approve{
background:#00c853;
color:white;
border:0;
padding:9px 15px;
border-radius:8px;
margin:5px;
}

.reject{
background:#ff3333;
color:white;
border:0;
padding:9px 15px;
border-radius:8px;
margin:5px;
}

.delete{
background:#555;
color:white;
border:0;
padding:9px 15px;
border-radius:8px;
margin:5px;
}

.status{
margin:10px 0;
font-weight:bold;
}

footer{
text-align:center;
padding:40px;
color:#888;
}

@media(max-width:600px){
.hero h1{font-size:40px}

.search{
flex-direction:column;
background:transparent;
gap:10px;
}

.search input,
.search button{
width:100%;
}

header{
padding:15px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">💈 all<span>barber</span></div>

<div>
🇦🇪 UAE

<button class="admin-button" onclick="openLogin()">
🔐 Admin
</button>
</div>
</header>


<section class="hero">

<h1>Find Your <span>Barber</span></h1>

<p>
Discover barbers and men's grooming services in
<strong>Al Ain, UAE</strong> 🇦🇪
</p>

<div class="search">

<input
id="searchInput"
type="text"
placeholder="Search barber, shave, haircut..."
oninput="searchBarbers()"
>

<button onclick="searchBarbers()">
🔍 SEARCH
</button>

</div>

</section>


<div class="filters">

<button class="filter active" onclick="filterService('all',this)">
All
</button>

<button class="filter" onclick="filterService('shave',this)">
🪒 Shaves
</button>

<button class="filter" onclick="filterService('haircut',this)">
✂️ Haircuts
</button>

<button class="filter" onclick="filterService('beard',this)">
🧔 Beard
</button>

<button class="filter" onclick="filterService('facial',this)">
🧖 Facial
</button>

</div>


<section class="container">

<h2 class="results-title">
💈 Al Ain Barbers
</h2>

<div class="barbers" id="barberList"></div>

</section>


<footer>
💈 allbarber UAE 🇦🇪
</footer>


<!-- ADMIN LOGIN -->

<div class="overlay" id="loginBox">

<div class="card">

<h2>🔐 Admin Login</h2>

<input
id="passwordInput"
class="input"
type="password"
placeholder="Enter admin password"
>

<button class="primary" onclick="login()">
LOGIN
</button>

<div id="loginError" class="error"></div>

<button class="secondary" onclick="closeLogin()">
CANCEL
</button>

</div>
</div>


<!-- BOOKING -->

<div class="overlay" id="bookingModal">

<div class="card">

<h2>📅 Book Appointment</h2>

<input id="bookingBarber" class="input" readonly>

<input
id="customerName"
class="input"
placeholder="Your name"
>

<input
id="customerPhone"
class="input"
placeholder="Phone number"
>

<input
id="bookingDate"
class="input"
type="date"
>

<input
id="bookingTime"
class="input"
type="time"
>

<select id="bookingService" class="select">

<option value="haircut">✂️ Haircut</option>
<option value="shave">🪒 Shave</option>
<option value="beard">🧔 Beard</option>
<option value="facial">🧖 Facial</option>

</select>

<button class="primary" onclick="submitBooking()">
📨 SEND BOOKING
</button>

<button class="secondary" onclick="closeBooking()">
CANCEL
</button>

<div id="bookingMessage"></div>

</div>
</div>


<!-- ADMIN PANEL -->

<div class="admin-panel" id="adminPanel">

<div class="admin-container">

<div class="admin-header">

<h2>💈 allbarber Admin Panel</h2>

<button class="close-admin" onclick="closeAdmin()">
CLOSE
</button>

</div>


<div class="admin-box">

<h3>📅 Customer Bookings</h3>

<div id="bookingList">
Loading bookings...
</div>

</div>


<div class="admin-box">

<h3>💈 Manage Barbers</h3>

<input
id="newName"
class="input"
placeholder="Barber name"
>

<input
id="newLocation"
class="input"
placeholder="Location"
>

<input
id="newRating"
class="input"
placeholder="Rating"
>

<input
id="newPrice"
class="input"
placeholder="Price"
>

<input
id="newServices"
class="input"
placeholder="Services: haircut, shave, beard, facial"
>

<button class="primary" onclick="addBarber()">
➕ ADD BARBER
</button>

<br><br>

<div id="adminList"></div>

</div>

</div>
</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://frkmrxlovberhpcdeizx.supabase.co";

const SUPABASE_KEY =
sb_publishable_7X86Ej3K9yXSxQqYigFnJw_sqU8RciY


/* ================================
   ADMIN PASSWORD
================================ */

const ADMIN_PASSWORD =
"AllBarber2026";


/* ================================
   BARBERS
================================ */

let barbers = [

{
name:"Hello Hair Men Salon",
location:"Al Ain",
rating:"4.7",
price:"Contact barber",
services:["haircut","shave","beard","facial"]
},

{
name:"Man Lab Gentlemen's Spa",
location:"Al Ain",
rating:"4.7",
price:"Contact barber",
services:["haircut","shave","beard","facial"]
},

{
name:"AL Waad Barbershop",
location:"Al Noud, Al Ain",
rating:"4.9",
price:"Contact barber",
services:["haircut","shave","beard"]
},

{
name:"DENIM Gents' Salon",
location:"Al Noud, Al Ain",
rating:"4.4",
price:"Contact barber",
services:["haircut","beard"]
},

{
name:"Imperial Cut Rotana",
location:"Al Jahili, Al Ain",
rating:"5.0",
price:"Contact barber",
services:["haircut","shave","beard"]
},

{
name:"Classic Gents Barber",
location:"Al Ain",
rating:"4.6",
price:"Contact barber",
services:["haircut","shave","beard"]
},

{
name:"Royal Men's Grooming",
location:"Al Ain",
rating:"4.8",
price:"Contact barber",
services:["haircut","shave","beard","facial"]
}

];


let currentFilter = "all";


/* ================================
   SUPABASE REQUEST
================================ */

async function supabaseRequest(path,options={}){

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/" +
path,
{
...options,
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=representation",
...(options.headers || {})
}
}
);

if(!response.ok){

const error =
await response.text();

throw new Error(error);

}

const text =
await response.text();

return text ? JSON.parse(text) : [];

}


/* ================================
   DISPLAY BARBERS
================================ */

function displayBarbers(){

const list =
document.getElementById("barberList");

list.innerHTML = "";

barbers.forEach((barber,index)=>{

const card =
document.createElement("div");

card.className = "barber";

card.dataset.search =
(
barber.name+" "+
barber.location+" "+
barber.services.join(" ")
).toLowerCase();

let servicesHTML =
barber.services
.map(
service =>
`<span class="tag">${service}</span>`
)
.join("");

card.innerHTML = `

<div class="barber-top">

<div class="icon">💈</div>

<h3>${barber.name}</h3>

</div>

<div class="info">

<div class="location">
📍 ${barber.location}
</div>

<div class="rating">
⭐ ${barber.rating}
</div>

<div class="price">
💰 ${barber.price}
</div>

<div class="tags">
${servicesHTML}
</div>

<button
class="book"
onclick="openBooking(${index})"
>
📅 BOOK NOW
</button>

</div>
`;

list.appendChild(card);

});

}


/* ================================
   SEARCH
================================ */

function searchBarbers(){

const search =
document.getElementById("searchInput")
.value
.toLowerCase();

document.querySelectorAll(".barber")
.forEach(card=>{

const matchesSearch =
card.dataset.search.includes(search);

const matchesFilter =
currentFilter === "all" ||
card.dataset.search.includes(currentFilter);

card.style.display =
matchesSearch && matchesFilter
? "block"
: "none";

});

}


/* ================================
   FILTER
================================ */

function filterService(service,button){

currentFilter = service;

document.querySelectorAll(".filter")
.forEach(item =>
item.classList.remove("active")
);

button.classList.add("active");

searchBarbers();

}


/* ================================
   BOOKING
================================ */

function openBooking(index){

document.getElementById("bookingBarber")
.value = barbers[index].name;

document.getElementById("bookingMessage")
.innerHTML = "";

document.getElementById("bookingModal")
.style.display = "flex";

}


function closeBooking(){

document.getElementById("bookingModal")
.style.display = "none";

}


async function submitBooking(){

const barber =
document.getElementById("bookingBarber").value;

const name =
document.getElementById("customerName")
.value.trim();

const phone =
document.getElementById("customerPhone")
.value.trim();

const date =
document.getElementById("bookingDate").value;

const time =
document.getElementById("bookingTime").value;

const service =
document.getElementById("bookingService").value;

const message =
document.getElementById("bookingMessage");

if(!name || !phone || !date || !time){

message.innerHTML =
'<div class="error">Please fill in all booking details.</div>';

return;

}

message.innerHTML = "Sending booking...";

try{

await supabaseRequest(
"bookings",
{
method:"POST",

body:JSON.stringify({

barber_name:barber,
customer_name:name,
customer_phone:phone,
booking_date:date,
booking_time:time,
service:service,
status:"Pending"

})

}
);

message.innerHTML =
'<div class="success">✅ Booking sent! The admin will review it.</div>';

document.getElementById("customerName").value = "";
document.getElementById("customerPhone").value = "";

}catch(error){

console.error(error);

message.innerHTML =
'<div class="error">❌ Booking failed. Please try again.</div>';

}

}


/* ================================
   ADMIN LOGIN
================================ */

function openLogin(){

document.getElementById("loginBox")
.style.display = "flex";

}


function closeLogin(){

document.getElementById("loginBox")
.style.display = "none";

}


async function login(){

const password =
document.getElementById("passwordInput").value;

if(password !== ADMIN_PASSWORD){

document.getElementById("loginError")
.innerText =
"Wrong password.";

return;

}

closeLogin();

document.getElementById("adminPanel")
.style.display = "block";

await loadBookings();

displayAdmin();

}


/* ================================
   LOAD BOOKINGS
================================ */

async function loadBookings(){

const list =
document.getElementById("bookingList");

list.innerHTML =
"Loading bookings...";

try{

const bookings =
await supabaseRequest(
"bookings?select=*&order=created_at.desc"
);

list.innerHTML = "";

if(bookings.length === 0){

list.innerHTML =
"<p>No bookings yet.</p>";

return;

}

bookings.forEach(booking=>{

const item =
document.createElement("div");

item.className =
"admin-item";

item.innerHTML = `

<strong>
💈 ${booking.barber_name}
</strong>

<br><br>

👤 Customer:
${booking.customer_name}

<br>

📱 Phone:
${booking.customer_phone}

<br>

📅 Date:
${booking.booking_date}

<br>

🕐 Time:
${booking.booking_time}

<br>

✂️ Service:
${booking.service}

<div class="status">
Status: ${booking.status}
</div>

<button
class="approve"
onclick="updateBooking(${booking.id},'Approved')"
>
✅ APPROVE
</button>

<button
class="reject"
onclick="updateBooking(${booking.id},'Rejected')"
>
❌ REJECT
</button>

<button
class="delete"
onclick="deleteBooking(${booking.id})"
>
🗑️ DELETE
</button>

`;

list.appendChild(item);

});

}catch(error){

console.error(error);

list.innerHTML =
'<div class="error">Could not load bookings.</div>';

}

}


/* ================================
   APPROVE / REJECT
================================ */

async function updateBooking(id,status){

try{

await supabaseRequest(
"bookings?id=eq."+id,
{
method:"PATCH",

body:JSON.stringify({
status:status
})

}
);

await loadBookings();

}catch(error){

console.error(error);

alert("Could not update booking.");

}

}


/* ================================
   DELETE BOOKING
================================ */

async function deleteBooking(id){

if(!confirm("Delete this booking?")){

return;

}

try{

await supabaseRequest(
"bookings?id=eq."+id,
{
method:"DELETE"
}
);

await loadBookings();

}catch(error){

console.error(error);

alert("Could not delete booking.");

}

}


/* ================================
   ADMIN BARBERS
================================ */

function displayAdmin(){

const list =
document.getElementById("adminList");

list.innerHTML = "";

barbers.forEach((barber,index)=>{

const item =
document.createElement("div");

item.className =
"admin-item";

item.innerHTML = `

<strong>${barber.name}</strong>

<br>

📍 ${barber.location}

<br>

⭐ ${barber.rating}

<br>

💰 ${barber.price}

<br>

Services:
${barber.services.join(", ")}

<br><br>

<button
class="delete"
onclick="deleteBarber(${index})"
>
🗑️ DELETE
</button>

`;

list.appendChild(item);

});

}


function addBarber(){

const name =
document.getElementById("newName")
.value.trim();

const location =
document.getElementById("newLocation")
.value.trim();

const rating =
document.getElementById("newRating")
.value.trim();

const price =
document.getElementById("newPrice")
.value.trim();

const services =
document.getElementById("newServices")
.value
.toLowerCase()
.split(",")
.map(x=>x.trim())
.filter(Boolean);

if(!name || !location){

alert("Enter barber name and location.");

return;

}

barbers.push({

name:name,

location:location,

rating:rating || "New",

price:price || "Contact barber",

services:
services.length
? services
: ["haircut"]

});

displayBarbers();

displayAdmin();

document.getElementById("newName").value = "";
document.getElementById("newLocation").value = "";
document.getElementById("newRating").value = "";
document.getElementById("newPrice").value = "";
document.getElementById("newServices").value = "";

}


function deleteBarber(index){

if(confirm("Delete this barber?")){

barbers.splice(index,1);

displayBarbers();

displayAdmin();

}

}


/* ================================
   CLOSE ADMIN
================================ */

function closeAdmin(){

document.getElementById("adminPanel")
.style.display = "none";

}


/* ================================
   START
================================ */

displayBarbers();

</script>

</body>
</html>
